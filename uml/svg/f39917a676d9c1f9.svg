<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" width="395px" viewBox="0 0 395 621" zoomAndPan="magnify" preserveAspectRatio="xMidYMid meet" contentStyleType="text/css"><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="195.791" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="50.785" y="55" width="290.013" height="52.594" fill="#FFFDF8" style="stroke:#57534E;stroke-width:0.5;" rx="2" ry="2"/><text x="60.785" y="77.995" fill="#292524" font-size="14" textLength="183.682" font-family="'Source Serif 4'">1. Read the use case text.</text><text x="60.785" y="94.292" fill="#292524" font-size="14" textLength="270.013" font-family="'Source Serif 4'">Underline every action and every rule.</text><rect x="70.992" y="127.594" width="249.599" height="52.594" fill="#FFFDF8" style="stroke:#57534E;stroke-width:0.5;" rx="2" ry="2"/><text x="80.992" y="150.589" fill="#292524" font-size="14" textLength="195.61" font-family="'Source Serif 4'">2. For each underlined part,</text><text x="80.992" y="166.886" fill="#292524" font-size="14" textLength="229.599" font-family="'Source Serif 4'">find its place in the SD and DCD.</text><rect x="16" y="200.188" width="359.582" height="68.891" fill="#FFFDF8" style="stroke:#57534E;stroke-width:0.5;" rx="2" ry="2"/><text x="26" y="223.183" fill="#292524" font-size="14" textLength="339.582" font-family="'Source Serif 4'">3. Walk through each SD, message by message.</text><text x="26" y="239.479" fill="#292524" font-size="14" textLength="184.652" font-family="'Source Serif 4'">Is it a method in the DCD?</text><text x="26" y="255.776" fill="#292524" font-size="14" textLength="247.639" font-family="'Source Serif 4'">Can the sender reach the receiver?</text><rect x="75.726" y="289.078" width="240.131" height="52.594" fill="#FFFDF8" style="stroke:#57534E;stroke-width:0.5;" rx="2" ry="2"/><text x="85.726" y="312.073" fill="#292524" font-size="14" textLength="201.503" font-family="'Source Serif 4'">4. Check the activation bars,</text><text x="85.726" y="328.37" fill="#292524" font-size="14" textLength="220.131" font-family="'Source Serif 4'">parameter types and the actor.</text><rect x="56.872" y="361.672" width="277.838" height="52.594" fill="#FFFDF8" style="stroke:#57534E;stroke-width:0.5;" rx="2" ry="2"/><text x="66.872" y="384.667" fill="#292524" font-size="14" textLength="257.838" font-family="'Source Serif 4'">5. Compare domain model and DCD:</text><text x="66.872" y="400.964" fill="#292524" font-size="14" textLength="243.236" font-family="'Source Serif 4'">missing attributes or associations?</text><rect x="87.042" y="434.266" width="217.497" height="52.594" fill="#FFFDF8" style="stroke:#57534E;stroke-width:0.5;" rx="2" ry="2"/><text x="97.042" y="457.261" fill="#292524" font-size="14" textLength="195.597" font-family="'Source Serif 4'">6. Check GRASP: Controller,</text><text x="97.042" y="473.558" fill="#292524" font-size="14" textLength="197.497" font-family="'Source Serif 4'">Information Expert, Creator.</text><rect x="71.163" y="506.859" width="249.257" height="52.594" fill="#FFFDF8" style="stroke:#57534E;stroke-width:0.5;" rx="2" ry="2"/><text x="81.163" y="529.854" fill="#292524" font-size="14" textLength="229.257" font-family="'Source Serif 4'">7. Write each problem: id, place,</text><text x="81.163" y="546.151" fill="#292524" font-size="14" textLength="163.092" font-family="'Source Serif 4'">reason, fix, alternative.</text><ellipse cx="195.791" cy="590.453" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="195.791" cy="590.453" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="195.791" y1="35" x2="195.791" y2="55" style="stroke:#57534E;stroke-width:1;"/><polygon points="191.791,45,195.791,55,199.791,45,195.791,49" fill="#57534E" style="stroke:#57534E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="195.791